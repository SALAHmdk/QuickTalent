<!-- src/app/features/auth/login/login.component.html -->
<div class="container col-md-4">
  <h2 class="text-center my-4">Connexion</h2>
  <form (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input id="email" name="email" type="email"
             class="form-control" [(ngModel)]="email" required />
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Mot de passe</label>
      <input id="password" name="password" type="password"
             class="form-control" [(ngModel)]="password" required />
    </div>
    <button type="submit"
            class="btn btn-primary w-100"
            [disabled]="loading">
      {{ loading ? 'Connexion...' : 'Se connecter' }}
    </button>
  </form>
  <div class="mt-3 text-center">
    <a routerLink="/auth/register-candidat">S’inscrire en tant que Candidat</a><br/>
    <a routerLink="/auth/register-recruteur">S’inscrire en tant que Recruteur</a>
  </div>
</div>
