<!-- src/app/features/auth/candidat/offres-list/offres-list.component.html -->
<div class="container col-md-8 mx-auto">
  <h2 class="my-4">Liste des offres</h2>

  <div class="mb-3 row">
    <div class="col-md-6">
      <input
        type="text"
        class="form-control"
        placeholder="Filtrer par titre..."
        [(ngModel)]="titreFilter"
        name="titreFilter"
      />
    </div>
    <div class="col-md-6">
      <input
        type="text"
        class="form-control"
        placeholder="Filtrer par ville..."
        [(ngModel)]="villeFilter"
        name="villeFilter"
      />
    </div>
  </div>

  <div *ngIf="filteredOffres.length === 0 && !loading" class="alert alert-warning">
    Aucune offre trouvée.
  </div>

  <ul class="list-group" *ngIf="filteredOffres.length > 0">
    <li
      class="list-group-item"
      *ngFor="let offre of filteredOffres"
      (click)="onSelectOffre(offre.id)"
      style="cursor: pointer;"
    >
      <h5>{{ offre.titre }}</h5>
      <p>{{ offre.ville }} – {{ offre.dateCreation | date:'dd/MM/yyyy' }}</p>
      <p>{{ offre.description | slice:0:100 }}…</p>
    </li>
  </ul>
</div>
