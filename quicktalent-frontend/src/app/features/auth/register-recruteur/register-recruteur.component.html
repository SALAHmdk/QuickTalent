<!-- src/app/features/auth/register-recruteur/register-recruteur.component.html -->
<div class="container col-md-4">
  <h2 class="text-center my-4">Inscription Recruteur</h2>
  <form (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label for="entreprise" class="form-label">Entreprise</label>
      <input id="entreprise" name="entreprise" type="text"
             class="form-control"
             [(ngModel)]="recruteur.entreprise" name="entreprise" required />
    </div>
    <div class="mb-3">
      <label for="nom" class="form-label">Nom</label>
      <input id="nom" name="nom" type="text"
             class="form-control"
             [(ngModel)]="recruteur.nom" name="nom" required />
    </div>
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input id="email" name="email" type="email"
             class="form-control"
             [(ngModel)]="recruteur.email" name="email" required />
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Mot de passe</label>
      <input id="password" name="password" type="password"
             class="form-control"
             [(ngModel)]="recruteur.password" name="password" required minlength="6" />
    </div>
    <button type="submit" class="btn btn-success w-100" [disabled]="loading">
      {{ loading ? 'Enregistrement...' : 'S’inscrire' }}
    </button>
  </form>
  <div class="mt-3 text-center">
    <a routerLink="/auth/login">Déjà inscrit ? Se connecter</a>
  </div>
</div>
