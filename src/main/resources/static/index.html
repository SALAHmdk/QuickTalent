<!DOCTYPE html>
<html lang="fr" ng-app="quickTalentApp">
<head>
  <meta charset="UTF-8" />
  <title>Quick Talent</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="lib/bootstrap/css/bootstrap.min.css">
  <!-- Votre CSS personnalisé -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body ng-controller="MainController as vm">

  <!-- Barre de navigation -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <a class="navbar-brand" href="#">QuickTalent</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse"
            data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
            aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item" ng-class="{active: vm.isActive('/')}">
          <a class="nav-link" href="#!/">Accueil</a>
        </li>
        <li class="nav-item" ng-class="{active: vm.isActive('/candidats')}">
          <a class="nav-link" href="#!/candidats">Candidats</a>
        </li>
        <li class="nav-item" ng-class="{active: vm.isActive('/offres')}">
          <a class="nav-link" href="#!/offres">Offres</a>
        </li>
        <li class="nav-item" ng-class="{active: vm.isActive('/recruteurs')}">
          <a class="nav-link" href="#!/recruteurs">Recruteurs</a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Zone de routing AngularJS -->
  <div class="container mt-4">
    <div ng-view></div>
  </div>

  <!-- Librairies externes -->
  <script src="lib/jquery/jquery.min.js"></script>
  <script src="lib/bootstrap/js/bootstrap.min.js"></script>
  <script src="lib/angularjs/angular.min.js"></script>
  <script src="lib/angularjs/angular-route.min.js"></script> <!-- Pour le routing -->
  <!-- Votre fichier Angular principal -->
  <script src="js/app.js"></script>
</body>
</html>
