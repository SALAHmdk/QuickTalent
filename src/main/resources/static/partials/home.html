<div class="row">
    <div class="col-md-12">
        <h2>Liste des offres</h2>
        <div class="form-inline">
            <div class="form-group">
                <input type="text" class="form-control" placeholder="Rechercher par ville" ng-model="searchVille" ng-change="filterVille()">
            </div>
            <div class="form-group">
                <input type="text" class="form-control" placeholder="Rechercher par titre" ng-model="searchTitre" ng-change="filterTitre()">
            </div>
        </div>
        <br>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Titre</th>
                    <th>Ville</th>
                    <th>Description</th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="offre in offres">
                    <td>{{ offre.titre }}</td>
                    <td>{{ offre.ville }}</td>
                    <td>{{ offre.description }}</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
