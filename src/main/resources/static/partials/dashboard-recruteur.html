<div>
  <h2>Mon Tableau de Bord Recruteur</h2>
  <p>Bienvenue, {{ vm.username }} !</p>
  <h3>Mes offres publiées</h3>
  <table class="table table-striped">
    <thead>
      <tr>
        <th>Titre de l'offre</th>
        <th>Nombre de candidatures</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr ng-repeat="o in vm.offres">
        <td>{{ o.titre }}</td>
        <td>{{ o.nombreCandidatures }}</td>
        <td>
          <button class="btn btn-info btn-sm" ng-click="vm.editOffre(o.id)">Éditer</button>
          <button class="btn btn-danger btn-sm" ng-click="vm.deleteOffre(o.id)">Supprimer</button>
        </td>
      </tr>
      <tr ng-if="!vm.offres.length">
        <td colspan="3" class="text-center">Vous n'avez pas encore publié d'offres.</td>
      </tr>
    </tbody>
  </table>
</div>
