<div class="row">
    <div class="col-md-6 col-md-offset-3">
        <h3>Inscription Recruteur</h3>
        <form ng-submit="registerRecruteur()">
            <div class="form-group">
                <label for="entreprise">Entreprise :</label>
                <input type="text" class="form-control" id="entreprise" ng-model="user.entreprise" required>
            </div>
            <div class="form-group">
                <label for="email">Email :</label>
                <input type="email" class="form-control" id="email" ng-model="user.email" required>
            </div>
            <div class="form-group">
                <label for="password">Mot de passe :</label>
                <input type="password" class="form-control" id="password" ng-model="user.password" required>
            </div>
            <button type="submit" class="btn btn-success">S’inscrire</button>
        </form>
    </div>
</div>
