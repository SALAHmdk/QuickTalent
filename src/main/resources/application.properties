spring.application.name=QuickTalent
# Paramètres de connexion à MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/quicktalent_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

server.port=8082

# Dialecte Hibernate pour MySQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Afficher les requêtes SQL dans la console (pour debug)
spring.jpa.show-sql=true

management.endpoints.web.exposure.include=health,info,mappings
management.endpoint.mappings.enabled=true
management.endpoints.web.base-path=/actuator
